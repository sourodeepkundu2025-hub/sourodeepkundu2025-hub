<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="300" viewBox="0 0 1100 300" role="img" aria-labelledby="title description"><title id="title">From models to working systems</title><desc id="description">Original editorial identity artwork. Three independent areas: machine learning, agent systems and dependable software. Not a system architecture or experimental result.</desc><style>text{font-family:Arial,Helvetica,sans-serif} .mono{font-family:monospace}</style>
